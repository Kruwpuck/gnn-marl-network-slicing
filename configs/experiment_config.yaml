env:
  n_gnb: 5
  n_prb: 50
  bandwidth_hz: 10_000_000
  carrier_freq_ghz: 3.5
  scenario: UMa
  h_bs: 25.0
  h_ut: 1.5
  area_size: 500
  n_ue_per_gnb: 5
  # Radius (m) each UE is dropped within, around its OWN serving gNB — NOT the same
  # thing as area_size (gNB-to-gNB spacing). Bug-fix v2->v3: UE and gNB positions used
  # to be sampled independently over the same area_size square (see env docstring for
  # why that invalidates v1/v2). diag_topology_sweep.py: r=100m gives ~92% of gNBs
  # positive SIR while still leaving real cell-edge cases (p10 SIR ~2dB) for the
  # fairness/cell-edge KPI to be meaningful; r=50m was tried and nearly eliminates
  # cell-edge (p10 ~10dB) — deliberately not used.
  ue_radius_m: 100
  slice_coupled_interference: true
  slot_duration_ms: 1.0

slices:
  embb:
    min_throughput_mbps: 4.0
  urllc:
    max_delay_ms: 10.0
    reliability: 0.999

reward:
  w1: 0.4
  w2: 0.3   # only used when cmdp.enabled=false (scalarized ablation)
  w4: 0.1

traffic:
  urllc:
    # packets/sec. Calibrated via scripts/diag_traffic_sweep.py + scripts/diag_breakdown.py
    # AFTER the ue_radius_m channel fix (see env docstring): at this load, static
    # frac=0.1 gives ~13% network-wide violation (contested), frac=0.8 gives ~5.6%
    # (structural floor from cell-edge gNBs, spread across gNBs not dominated by one) —
    # matches cmdp.delta below with a +4.4pp safety margin.
    # Raised 25000 -> 60000 (option O1, 2026-08-06, human decision recorded in
    # runs/2026-08-05-run01/ledger.md). Task-property justification, measured with
    # scripts/probe_action_floor.py on held-out seeds, 200 episodes:
    #   At 25000 the ENTIRE violation range reachable by any policy was 3.66-5.26%
    #   (1.6 pp wide) while the between-seed-population noise was 2.0 pp. No policy
    #   could steer the constraint, so no architecture could differ -- that, not the
    #   dual dynamics, is why v3 returned 35/40 COMPARABLE.
    #   At 60000 the reachable range is 21.8% -> 11.9% (9.9 pp), ~6x the dual-update
    #   window std and ~10x the standard error. Drops stay 100% deadline-driven
    #   (overflow 0.00% at every tier), and eMBB responds to allocation
    #   (7.84 -> 4.39 -> 0.00 Mbps), so the objective/constraint tension is real.
    #   90000 was also measured (range 17.3 pp) and NOT chosen: it would force
    #   delta ~= 0.21, further from any defensible URLLC SLA.
    lambda_arrival: 60000.0   # ~15.4 Mbps/gNB offered load (60000 * 256 bits/pkt)
    packet_size_bits: 256
  embb:
    lambda_burst: 30.0        # Mbps
    lambda_idle: 2.0          # Mbps
    r_burst_to_idle: 20.0     # 1/sec -> mean burst duration 50 ms
    r_idle_to_burst: 10.0     # 1/sec -> mean idle duration 100 ms

buffer:
  # urllc_max_bits raised 40960 -> 131072 (Fase 2, docs/rev2-implementation-plan.md #5.1):
  # delay-bandwidth product = lambda_arrival*packet_size_bits * (urllc.max_delay_ms/1000)
  # = 25000*256 * 0.010 = 64000 bit. Old value (40960) was 0.64x DBP -- buffer filled
  # before deadline-drop could matter, so violations were overflow-dominated, not
  # deadline-dominated. New value = 2x DBP + burst margin, so the deadline mechanism
  # is what binds, matching the CMDP's intended constraint semantics.
  # Rescaled 131072 -> 307200 together with lambda_arrival (2026-08-06). The RULE is
  # unchanged -- buffer = 2x delay-bandwidth product -- only the load it is evaluated
  # at moved: 2 * 60000 * 256 * 0.010 = 307200 bit. Raising the load WITHOUT rescaling
  # was measured and rejected: at lambda=60000 with the old buffer, drops became
  # overflow-dominated (late 8.21% vs overflow 6.19%, i.e. 1.3:1) and Gate A3 requires
  # >= 3:1; at lambda=90000 it collapsed to 0.3:1. With the rescale, overflow is
  # 0.00% at every tier and every load probed.
  urllc_max_bits: 307200
  embb_max_bits: 50_000_000

cmdp:
  enabled: true
  # Constraint is NETWORK-WIDE (mean violation across all n_gnb per step), not
  # per-agent — a persistently weak (cell-edge) gNB can run above delta as long as
  # the network mean stays under it. delta=0.12 (raised from 0.10): window-level
  # (dual_update_every-sized) violation std at frac=0.8 measured 1.91pp
  # (scripts/diag_window_variance.py) — too close to the 2.00pp comfort threshold to
  # trust as a safe buffer given only 20 sampled windows; a 200K/1M-step real run
  # will sample far more windows and could realize a worse tail. delta=0.12 keeps a
  # comfortable margin above the ~5.6-8% structural floor (scripts/diag_breakdown.py)
  # at low cost (CMDP gradient is still strongly active: frac=0.1 alone gives ~13%
  # violation, well above delta).
  # delta lowered 0.12 -> 0.05 (Fase 2 #5.1): 0.12 was calibrated against a STATIC
  # policy (scripts/calibrate_load.py), which passed the gate while trained policies
  # ran far below it -- the constraint never bound during training. 0.05 is a starting
  # point; scripts/calibrate_trained.py (#5.2) is what sets the final value by raising
  # load/lowering delta against a TRAINED policy until held-out violation sits near
  # delta (target 5-12%).
  # delta 0.05 -> 0.15 (2026-08-06). Set by a rule written into the ledger BEFORE the
  # measurement that feeds it, so the value could not be chosen after seeing which
  # allocation -- or which algorithm -- it favours:
  #   delta = held-out violation floor + 3.0 pp, rounded to the nearest 0.005, where
  #   the floor is the minimum over tiers that still leave eMBB >= 1.0 Mbps (frac=1.00
  #   reaches 11.94% but starves eMBB to 0.00 Mbps, so it is not a usable operating
  #   point). Measured floor = 12.22% at frac=0.90 -> delta = 0.1522 -> 0.150.
  # The 3.0 pp margin is the window-variance argument: the margin must exceed the
  # dual-update window std (1.77 pp at the new dual_update_every) or the constraint is
  # not reliably satisfiable at the noise level the dual actually sees.
  # Consequence that must be reported, not hidden: slices.urllc.reliability below says
  # 0.999, but this environment cannot deliver 99.9% at ANY allocation -- its drops are
  # deadline-bound, not PRB-bound (scripts/diag_breakdown.py: raising allocation from
  # 0.5 to 0.8 moves gNB-0 by 0.0 pp). delta=0.15 is the level at which the constraint
  # genuinely binds; the gap to the nominal SLA is a property of the task and belongs
  # in the paper.
  # 0.15 -> 0.085 (2026-08-06, second operating point tested -- the first is reported
  # too, goal1.md integritas #3 forbids showing only the favourable one). The RULE is
  # unchanged (floor + 3.0 pp, rounded to 0.005); the ANCHOR was wrong. delta=0.15 used
  # the STATIC-allocation floor of 12.22%, and goal1.md's own constraint says
  # calibration must be done against a TRAINED policy. Gate A round 4 showed why:
  # unconstrained training violation was ~10.2%, already below 0.15, so lambda fell to
  # 0 within 100K steps and A2b failed at 0.02pp of movement.
  # Trained-policy floor, measured by pinning lambda and reading the policy the way it
  # actually behaves (150 held-out episodes, sampled actions):
  #   lambda    0     1     5    12    30
  #   viol%  10.57 10.30  8.87  6.69  5.49
  # Floor 5.49% + 3.0 pp = 8.49% -> 0.085. Equilibrium lambda lands near 8, well below
  # the lambda=12..30 band where the greedy readout degenerates (see
  # scripts/evaluate_checkpoints.py --stochastic).
  # Note eMBB is flat (8.02-8.19 Mbps) across that whole lambda range: the policy buys
  # 5 pp of violation without paying throughput, so the gain is temporal placement of
  # PRB, not a static allocation trade-off. That is the adaptivity the architectures
  # are supposed to differ on, and it exists at this operating point.
  delta: 0.085
  lambda_init: 1.0
  # lambda_lr raised 0.01 -> 2.0 and dual_update_every 2000 -> 5000 (Gate A run
  # central-ppo_calib_seed42, 2026-08-05). Both are SOLVER properties, chosen from
  # a-priori rules, not from which algorithm they favour (goal1.md integritas #1):
  #
  # lambda_lr: the dual must be able to traverse the range where the penalty is
  #   comparable to the objective, within the SHORTEST budget family. Rule: a
  #   persistent one-delta gap must carry lambda from lambda_init to the Gate A2
  #   activity threshold (5.0) within the DQN budget (200K steps / 5000 =
  #   40 updates): lr >= 4.0 / (delta * 40) = 2.0.
  #   Raised again 2.0 -> 14.0 after round 2 (central-ppo_calib2_seed42). The rule
  #   is unchanged; only the gap it is evaluated at is now MEASURED instead of
  #   hypothetical. Round 2 shows lambda still travelling at the end of training
  #   (1.00 -> 3.34, monotone per 100K-step bin, no plateau) with violation flat at
  #   5.5-6.2%, i.e. the realized gap is ~0.0075, not the one-delta 0.05 the first
  #   rule assumed. Same requirement at the realized gap:
  #   lr >= (5.0 - lambda_init) / (0.0075 * 40) = 13.3 -> 14.0.
  #   Binding budget is DQN (40 updates); PPO gets 200. A single lr is mandatory
  #   (goal1.md C2 forbids per-algorithm hyperparameters), so the shorter family
  #   sets it. Consequence to report: the two budget families do not experience the
  #   same number of dual updates -- another reason C3 forbids pooling them.
  #   At 0.01 this was impossible by construction: per-update step = 0.01 * gap
  #   ~= 1e-4, so 500 updates moved lambda by 0.03 (measured 1.000 -> 1.033). That,
  #   not the traffic load, is why the constraint never bound in v3 (lambda
  #   0.58-1.02 across all 40 runs regardless of algorithm).
  # dual_update_every: signal-to-noise. The per-window violation estimate must be
  #   quiet enough that the dual tracks the mean, not the noise (Gate A4, < 2.0pp).
  #   Measured on the calibration run: std 2.74pp @ 2000 steps, 1.87 @ 4000,
  #   1.56 @ 6000 (~1/sqrt(n) as expected). 5000 gives ~1.73pp with margin while
  #   keeping 40 dual updates in the 200K DQN budget.
  # lambda_lr re-derived (not changed) for the new operating point. The old anchor
  # "lambda must reach the Gate A2 activity threshold of 5.0" died with the 2026-08-06
  # amendment that replaced A2 with A2a/A2b. New anchor, same spirit: the dual must be
  # able to travel from lambda_init to the scale where the penalty is comparable to the
  # objective, within the SHORTEST budget family.
  #   r_obj at the operating region ~= w1*(7.5/4) + w4*(37.5e6/1e7) = 0.75 + 0.375 = 1.13
  #   lambda* where lambda*delta ~= r_obj: 1.13 / 0.15 ~= 7.5
  #   DQN budget now gives 200000 / 12500 = 16 dual updates, so
  #   lr >= (7.5 - 1.0) / (gap * 16) = 0.41 / gap. At 14.0 this covers any realized gap
  #   >= 0.029, i.e. a policy sitting within 2.9 pp of delta still drives the dual to
  #   equilibrium inside the shortest budget. Kept at 14.0 rather than retuned: the rule
  #   is a lower bound and changing the value without evidence is churn.
  lambda_lr: 14.0
  lambda_max: 100.0
  # dual_update_every 5000 -> 12500 (2026-08-06). Same signal-to-noise rule as before,
  # re-evaluated at the new load, where the per-episode violation std rose from ~7.8 pp
  # to ~14.0 pp (scripts/probe_action_floor.py, 200 held-out episodes, tiers 0.5-0.9).
  # A window holds dual_update_every / episode_length episodes, so the window std is
  # ~14.0 / sqrt(n): 5000 -> 25 ep -> 2.80 pp (fails Gate A4's < 2.0 pp), 10000 -> 1.98 pp
  # (on the threshold), 12500 -> 62.5 ep -> 1.77 pp (passes with margin). 12500 is the
  # cheapest value that passes while keeping 16 dual updates inside the 200K DQN budget.
  # Consequence to report: DQN gets 16 dual updates, PPO gets 80. The two budget
  # families do not experience the same constraint dynamics even with identical
  # parameters (C2 forbids per-algorithm values) -- another reason C3 forbids pooling.
  dual_update_every: 12500

resilient:
  # Second constraint, independent of the URLLC one above (docs/revisi/PLAN-02).
  # The URLLC constraint is NETWORK-WIDE by design; this one is PER-gNB, which is the
  # whole point -- an aggregate constraint structurally permits sacrificing a minority
  # (PLAN-07 section 2), and that is the mechanism being tested.
  #
  # UNIT: per-gNB, not per-UE, and that is a deliberate correction to PLAN-02 section 3.
  # The environment has no per-UE rate to attach a per-UE constraint to: SINR is computed
  # from the MEAN path loss over a gNB's five UEs (network_slicing_env.py:279), eMBB is one
  # fluid queue per gNB (:317-320), and embb_p5_mbps is the 5th percentile over (gNB x slot)
  # samples (evaluate_checkpoints.py:148-171), not over users. Constraining what the
  # environment actually produces is what keeps the constraint and the metric in the same
  # unit. Consequence for the paper: this is a per-CELL minimum-rate constraint with
  # learnable slack; TSP 2023 is cited for the mechanism, never as an identical setup.
  #
  # mode: none = v4 behaviour, bit-identical (tests/test_resilient.py asserts it)
  #       fixed = f_min with no slack (z == 0), the honesty arm of PLAN-02 section 8
  #       learned = full proposal, z learned
  mode: none
  # Frozen by the calibration protocol in PLAN-02 section 7 and recorded in the ledger
  # BEFORE the wave. null is deliberate: mode != none with f_min unset must fail loudly at
  # construction rather than silently constrain against 0.
  f_min_mbps: null
  c: 0.1
  # Timescale separation alpha_z << alpha_mu < alpha_theta (PLAN-02 section 4). If the slack
  # moves as fast as the multiplier it just loosens to chase the policy and the constraint
  # goes vacuous -- the same failure mode as the vacuous lambda in v3.
  alpha_mu: 0.01
  alpha_z: 0.001
  mu_init: 0.0
  z_init: 0.0
  mu_max: 100.0
  z_max: 10.0

floor:
  # Primary mode dynamic -> none (2026-08-06). Decided by criteria K1-K5 written into
  # runs/2026-08-05-run01/ledger.md BEFORE the measurement, none of which mentions any
  # algorithm. All three modes PASS all five criteria at the new operating point, and
  # the full held-out tier grid (200 episodes) shows why: for frac >= 0.30 the three
  # modes are identical to the last digit (20.06 / 16.71 / 14.93 / 13.84 / 13.12 /
  # 12.58 / 12.22 / 11.94 %). The floor only decides what happens in the starvation
  # corner:
  #   frac   none    static  dynamic
  #   0.00   94.50   48.72   21.76
  #   0.10   48.72   48.72   21.76
  #   0.20   27.46   27.46   21.79
  # So at this operating point the floor is no longer a controller inside the operating
  # region -- it is a safety net over bad actions. `none` was selected by the
  # pre-registered tie-break (largest K1 margin; ties broken toward the simpler mode).
  # Both readings of K1 agree: on total range `none` wins outright, and on the stricter
  # reading (leverage only where a sane policy operates, frac >= 0.30) the three modes
  # are degenerate and the simplicity tie-break decides.
  # Two consequences that make `none` the honest default here: every action the agent
  # can take now has a distinct outcome, and cell_edge_collapse_rate (a primary metric)
  # stays reachable instead of being masked by the projection. `static` and `dynamic`
  # remain the pre-registered ablation factor exactly as in v3
  # (results/RLIABLE_floorstatic.md, results/RLIABLE_floornone.md).
  mode: none        # none | static | dynamic
  base: 0.10
  k: 0.30
  lo: 0.10
  hi: 0.40

training:
  seed: 42
  n_steps: 1_000_000
  episode_length: 200

agent:
  # Moved here from Python defaults in agents/*.py on 2026-08-16 (goal1.md C2: every
  # hyperparameter comes from this one file). The wave itself ran on the defaults, and
  # every value below is bit-identical to the default it replaced -- verified by
  # tests/test_hparams_identity.py -- so the v4 checkpoints stay reproducible from this
  # config. Nothing was retuned; a reader of this file previously could not see the
  # numbers the runs actually used, which is the reproducibility hole being closed.
  #
  # The dqn/ppo split is NOT per-algorithm tuning. It is the same structural family split
  # as the step budget (200K vs 1M): the four algorithms inside each family share one set,
  # and C3 already forbids pooling the two families in any statistical claim.
  n_actions: 11
  hidden: 128
  # Neighbourhood size for the mlp-knn-ppo adaptation baseline (goal1.md §Fallback poin 2).
  # Not a free knob: 4 is the node degree every agent saw during training, since the
  # inter-gNB interference graph is fully connected at n_gnb=5 (envs/channel_model.py).
  # Keeping it fixed is what makes that baseline's obs_dim independent of n_gnb, so it can
  # transfer to 10/20 gNB the way the GNN can.
  knn_k: 4
  dqn:
    lr: 0.001
    gamma: 0.99
    epsilon: 1.0
    epsilon_min: 0.05
    epsilon_decay: 0.9995
    max_grad_norm: 10.0     # was hard-coded in DQNAgent.learn / MLPDQNAgent.learn
    batch_size: 64          # was BATCH_SIZE in training/train_*.py
    replay_capacity: 50000  # was ReplayBuffer(50_000) at the call site
    replay_start: 1000      # was REPLAY_START in training/train_*.py
  ppo:
    lr: 0.0003
    clip_eps: 0.2
    entropy_coef: 0.01
    value_coef: 0.5
    max_grad_norm: 0.5
    rollout_steps: 512      # was ROLLOUT_STEPS in training/train_*.py

noise:
  thermal_dbm_per_hz: -174.0
  noise_figure_db: 7.0
  tx_power_dbm: 43.0
